<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Data terms, asked</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0d12; --card: #141821; --edge: #222a38; --text: #e8ecf4;
    --muted: #8b95a8; --good: #3fa46a; --bad: #c0453c; --accent: #d8a24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  main { max-width: 620px; margin: 0 auto; padding-bottom: 32px; }
  h1 { font-size: 22px; letter-spacing: .02em; margin: 20px 0 4px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
  p.muted { color: var(--muted); margin: 4px 0 20px; }
  button {
    font: inherit; color: inherit; background: var(--card); border: 1px solid var(--edge);
    border-radius: 12px; padding: 14px 16px; width: 100%; text-align: left; margin-bottom: 10px;
    cursor: pointer;
  }
  button:active { transform: scale(.995); }
  button.chosen { border-color: var(--accent); background: #1b2030; }
  button.right { border-color: var(--good); background: #14261d; }
  button.wrong { border-color: var(--bad); background: #2a1715; }
  .main-button { background: var(--accent); color: #1a1205; border: none; text-align: center; font-weight: 600; }
  .picture {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px;
    background: #10141d; border: 1px solid var(--edge); display: block;
  }
  .placeholder { display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
  .question { font-size: 19px; font-weight: 600; margin: 16px 0 6px; }
  .hint { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .progress { flex: 1; height: 6px; background: var(--edge); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .explanation { border-left: 3px solid var(--accent); padding: 10px 14px; background: #131722; border-radius: 0 10px 10px 0; margin: 14px 0; }
  .pit { width: 100%; height: auto; margin: 8px 0 16px; border-radius: 14px; border: 1px solid var(--edge); }
  .small { font-size: 14px; color: var(--muted); }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > button { margin-bottom: 0; }
  .row > button.reset { width: auto; flex: none; color: var(--muted); font-size: 14px; }
  .row > input {
    width: 90px; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--edge);
    border-radius: 12px; padding: 12px; text-align: center;
  }
</style>
</head>
<body>
<main id="app"></main>

<script>
// state of the app: all cards, the current round, and what the player has chosen
const state = { cards: [], round: [], index: 0, chosen: new Set(), shown: false,
                right: 0, wrong: 0, order: [] };
const app = document.getElementById("app");

// Shuffle the answers, otherwise the right ones always sit in the same places.
function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// progress per card, kept in the browser: how many times in a row it was answered right
const store = {
  read() { try { return JSON.parse(localStorage.getItem("data-progress") || "{}"); } catch { return {}; } },
  write(p) { try { localStorage.setItem("data-progress", JSON.stringify(p)); } catch {} },
};
const sitting = (progress, card) => (progress[card.id] || 0) >= 2;

async function start() {
  const data = await fetch("cards.json").then(r => r.json());
  state.cards = data.cards;
  menu();
}

function menu() {
  const progress = store.read();
  const open = state.cards.filter(c => !sitting(progress, c)).length;
  const halfway = state.cards.filter(c => (progress[c.id] || 0) === 1).length;   // right once so far
  const done = state.cards.length - open;
  const sessions = [...new Set(state.cards.map(c => c.session))].sort((a, b) => a - b);
  app.innerHTML = `
    ${pitSvg()}
    <h1>Data terms, asked</h1>
    <p class="muted">Not quite Kolinahr, but it keeps asking until the terms stick. Every card has a
    picture, a question and more than one correct answer. New sessions appear here as the course
    goes on.</p>
    <button class="main-button" id="b-open">Everything not sitting yet, ${open}</button>
    <p class="small">${done} sitting · ${halfway} halfway there · ${open - halfway} not yet.
    A card sits once you get it right twice in a row.</p>
    <h2>A random mix from all sessions</h2>
    <div class="row">
      <input id="n-random" type="number" min="1" max="${state.cards.length}"
             value="${Math.min(10, state.cards.length)}" aria-label="how many questions">
      <button id="b-random">random questions</button>
    </div>
    <h2>By session</h2>
    ${sessions.map(s => {
      const here = state.cards.filter(c => c.session === s);
      const sat = here.filter(c => sitting(progress, c)).length;
      return `<div class="row"><button data-session="${s}">Session ${s}, ${here.length} cards, ${sat} sitting</button>
              <button class="reset" data-reset="${s}">Reset</button></div>`;
    }).join("")}
    <button id="b-all">All cards, ${state.cards.length}</button>
    <button id="b-reset" class="small">Reset everything, so all cards have to be learned again</button>`;
  document.getElementById("b-open").onclick = () => play(c => !sitting(store.read(), c));
  document.getElementById("b-all").onclick = () => play(() => true);
  document.getElementById("b-random").onclick = () => {      // N cards drawn from all sessions
    const n = Math.max(1, Math.min(state.cards.length,
                                   parseInt(document.getElementById("n-random").value, 10) || 10));
    play(() => true, n);
  };
  document.querySelectorAll("[data-session]").forEach(b => {
    b.onclick = () => play(c => c.session === Number(b.dataset.session));
  });
  document.getElementById("b-reset").onclick = () => {           // forget all progress
    if (confirm("Forget your progress on all cards?")) { store.write({}); menu(); }
  };
  document.querySelectorAll("[data-reset]").forEach(b => {        // forget one session's progress
    b.onclick = () => {
      const s = Number(b.dataset.reset);
      if (!confirm(`Forget your progress on session ${s}?`)) return;
      const p = store.read();
      state.cards.filter(c => c.session === s).forEach(c => delete p[c.id]);
      store.write(p);
      menu();
    };
  });
}

// a round: the chosen cards in random order, cut to `count` if given
function play(choose, count) {
  state.round = shuffle(state.cards.filter(choose)).slice(0, count || undefined);
  if (!state.round.length) return menu();
  state.index = 0; state.right = 0; state.wrong = 0;
  showCard();
}

function showCard() {
  const card = state.round[state.index];
  state.chosen = new Set();
  state.shown = false;
  const done = Math.round((state.index / state.round.length) * 100);
  app.innerHTML = `
    <div class="bar"><span>${state.index + 1} / ${state.round.length}</span>
      <span class="progress"><i style="width:${done}%"></i></span>
      <span>${state.right} right</span></div>
    <img class="picture" src="${card.image}" alt="" onerror="this.replaceWith(placeholder())">
    <div class="question">${card.question}</div>
    <div class="hint">Tap every answer you think is right, then check.</div>
    <div id="answers"></div>
    <button class="main-button" id="b-check">Check answer</button>
    <div id="after"></div>`;
  const box = document.getElementById("answers");
  state.order = shuffle([...card.answers.keys()]);
  state.order.forEach(original => {
    const b = document.createElement("button");
    b.textContent = card.answers[original];
    b.onclick = () => {
      if (state.shown) return;
      state.chosen.has(original) ? state.chosen.delete(original) : state.chosen.add(original);
      b.classList.toggle("chosen");
    };
    box.appendChild(b);
  });
  document.getElementById("b-check").onclick = check;
}

function placeholder() {
  const d = document.createElement("div");
  d.className = "picture placeholder";
  d.textContent = "image still rendering";
  return d;
}

function check() {
  if (state.shown) return;
  state.shown = true;
  const card = state.round[state.index];
  const correct = new Set(card.correct);
  const buttons = [...document.querySelectorAll("#answers button")];
  buttons.forEach((b, pos) => {
    const n = state.order[pos];
    b.classList.remove("chosen");
    if (correct.has(n)) b.classList.add("right");
    else if (state.chosen.has(n)) b.classList.add("wrong");
  });
  const ok = correct.size === state.chosen.size && [...correct].every(n => state.chosen.has(n));
  ok ? state.right++ : state.wrong++;

  const progress = store.read();
  progress[card.id] = ok ? Math.min((progress[card.id] || 0) + 1, 3) : 0;
  store.write(progress);
  const verdict = !ok ? "Not yet."                                  // what to tell the player
                : progress[card.id] >= 2 ? "Right, and now it sits."
                : "Right. Get it right once more and it sits.";

  document.getElementById("after").innerHTML = `
    <div class="explanation"><b>${verdict}</b> ${card.explanation}</div>
    <button class="main-button" id="b-next">${state.index + 1 < state.round.length ? "Next" : "Result"}</button>`;
  document.getElementById("b-next").onclick = () => {
    state.index++;
    state.index < state.round.length ? showCard() : finish();
  };
  document.getElementById("b-check").remove();
}

function finish() {
  const progress = store.read();
  const n = state.cards.filter(c => sitting(progress, c)).length;
  app.innerHTML = `
    <h1>${state.right} of ${state.round.length}</h1>
    <p class="muted">${n} of ${state.cards.length} terms are sitting. A card counts as sitting after
    two correct answers in a row, and falls back to zero on a mistake.</p>
    <button class="main-button" id="b-again">What is not sitting yet</button>
    <button id="b-menu">Back</button>`;
  document.getElementById("b-again").onclick = () => play(c => !sitting(store.read(), c));
  document.getElementById("b-menu").onclick = menu;
}

function pitSvg() {
  return `<svg class="pit" viewBox="0 0 620 300" role="img" aria-label="the pit">
    <defs>
      <radialGradient id="sky" cx="50%" cy="10%" r="90%">
        <stop offset="0%" stop-color="#2a1c10"/><stop offset="100%" stop-color="#0b0d12"/>
      </radialGradient>
    </defs>
    <rect width="620" height="300" fill="url(#sky)"/>
    <ellipse cx="310" cy="250" rx="300" ry="60" fill="#12151d"/>
    <ellipse cx="310" cy="250" rx="200" ry="40" fill="#0e1119"/>
    ${[...Array(9)].map((_, n) => {
      const x = 60 + n * 62.5, h = 70 + (n % 3) * 26;
      return `<rect x="${x}" y="${230 - h}" width="22" height="${h}" rx="3" fill="#1b2130"/>
              <circle cx="${x + 11}" cy="${228 - h}" r="5" fill="#d8a24a" opacity=".55"/>`;
    }).join("")}
    <g transform="translate(310 232)">
      <ellipse cx="0" cy="6" rx="26" ry="7" fill="#0a0c11"/>
      <path d="M0 -52 q13 10 13 30 L13 4 q-13 6 -26 0 L-13 -22 q0 -20 13 -30z" fill="#e8ecf4" opacity=".92"/>
      <circle cx="0" cy="-60" r="9" fill="#e8ecf4" opacity=".92"/>
      <rect x="14" y="-26" width="12" height="18" rx="3" fill="#d8a24a"/>
    </g>
  </svg>`;
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
